name: CI

on:
  pull_request:
  push:
    branches: ["integration/**", "feature/**", "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      gateway: ${{ steps.filter.outputs.gateway }}
      observability: ${{ steps.filter.outputs.observability }}
      infra: ${{ steps.filter.outputs.infra }}
      guard: ${{ steps.filter.outputs.guard }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web: ['apps/web/**', 'tests/e2e/**', '.github/workflows/ci.yml']
            api: ['services/api/**', 'tests/load/**', 'infra/resilience/**', 'infra/elasticmq/**', 'tools/**', 'docker-compose.yml', 'docker-compose.agents.yml', '.github/workflows/ci.yml']
            guard: ['services/guard/**', '.github/workflows/ci.yml']
            infra: ['infra/terraform/**', 'infra/deploy/**', '.github/workflows/**']
            observability: ['infra/observability/**', 'docker-compose.yml', '.github/workflows/ci.yml']
            gateway: ['services/model-gateway/**', 'tools/mock-llm/**', 'services/api/config.py', 'services/api/tests/test_gateway.py', '.github/workflows/ci.yml']

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  # Separate job so a failing audit is visible without blocking image builds/scans.
  web-audit:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - name: Dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: voyagent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d voyagent_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci:ci_only@localhost:5432/voyagent_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check tests
      - name: Tests (mock mode + Postgres integration)
        run: uv run pytest -q -rs

  # Real LiteLLM image (digest-pinned) + Postgres + mock upstream: fallbacks, virtual keys,
  # end-user spend and budgets, through the API's own client code.
  gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: litellm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d litellm"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --frozen
        working-directory: services/api
      - name: Start mock model server (primary model fails)
        run: |
          # venv python directly: a lingering `uv run` would hold uv's cache lock at job cleanup
          MOCK_LLM_FAIL_MODELS=mock-primary nohup services/api/.venv/bin/python -m \
            uvicorn server:app --app-dir tools/mock-llm --host 127.0.0.1 --port 9200 > mock-llm.log 2>&1 &
      - name: Start gateway
        run: |
          IMAGE=$(sed -n 's/^FROM //p' services/model-gateway/Dockerfile)
          docker run -d --name gateway --network host \
            -e LITELLM_MASTER_KEY=sk-ci-master-key \
            -e LITELLM_DATABASE_URL=postgresql://ci:ci_only@127.0.0.1:5432/litellm \
            -e MOCK_LLM_BASE=http://127.0.0.1:9200/v1 \
            -v "$PWD/services/model-gateway/config.test.yaml:/app/config.yaml:ro" \
            "$IMAGE" --config /app/config.yaml --port 4000
          for _ in $(seq 1 90); do
            curl -sf http://127.0.0.1:4000/health/readiness > /dev/null && exit 0
            sleep 2
          done
          docker logs gateway | tail -50; exit 1
      - name: Gateway tests (must not skip)
        working-directory: services/api
        env:
          GATEWAY_TEST_URL: http://127.0.0.1:4000
          GATEWAY_MASTER_KEY: sk-ci-master-key
          MOCK_LLM_URL: http://127.0.0.1:9200
          GATEWAY_TEST_DB: "1"
        run: |
          set -o pipefail
          uv run pytest -q -rs tests/test_gateway.py | tee gw.txt
          ! grep -q SKIPPED gw.txt
      - name: Gateway logs
        if: failure()
        run: docker logs gateway | tail -100; cat mock-llm.log | tail -30

  # Retrieval quality with a real semantic embedder (downloads bge-small, ~70 MB).
  rag-eval:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --frozen --group rag-local
      - name: Evaluate (fastembed, k=3)
        env: { RAG_EMBEDDER: fastembed }
        run: |
          set -o pipefail
          uv run python -m rag.eval 3 | tee eval.md
          echo "## Retrieval evaluation" >> "$GITHUB_STEP_SUMMARY"
          cat eval.md >> "$GITHUB_STEP_SUMMARY"
          # quality gate: hybrid + parent/child must keep Recall@3 = 1.0 and MRR >= 0.9
          grep -E '^\| parent-2000/child-400 \| hybrid \| 1\.0 \| [0-9.]+ \| (0\.9[0-9]*|1\.0) \|' eval.md

  # Full stack with the observability profile: traces, metrics, logs and dashboards end to end.
  observability:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    env:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    steps:
      - uses: actions/checkout@v4
      - name: Validate alert rules (promtool)
        run: docker run --rm --entrypoint promtool -v "$PWD/infra/observability/prometheus:/p:ro" prom/prometheus:v3.16.0 check rules /p/alerts.yml
      - name: Start stack
        run: docker compose --profile observability up -d --build postgres redis migrate orchestrator api ingest-worker otel-collector prometheus loki tempo grafana
      - name: Verify traces, metrics, logs, dashboards
        run: python3 infra/observability/verify.py
      - name: Stack logs
        if: failure()
        run: docker compose --profile observability ps; docker compose --profile observability logs --tail 60 api orchestrator otel-collector tempo loki prometheus

  # Infrastructure as code and delivery scripts: nothing is applied, only checked.
  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: terraform validate
        working-directory: infra/terraform/envs
        run: terraform init -backend=false -input=false && terraform validate
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - name: checkov (security scan of the Terraform)
        run: uvx --python 3.12 --from checkov==3.4.3 checkov -d infra/terraform --framework terraform --compact --quiet
      - name: shellcheck deploy script
        run: shellcheck infra/deploy/deploy.sh
      - name: actionlint (workflows)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  # Browser end-to-end + accessibility (Playwright, axe-core) against real web builds and the API.
  e2e:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            tests/e2e/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --frozen
        working-directory: services/api
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Playwright (plan, auth, guardrails, accessibility)
        run: bash tests/e2e/run-e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            tests/e2e/.servers/*.log
          retention-days: 7

  # Load test (k6) and failure injection + backup/restore drill on the compose stack.
  resilience:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    env:
      MOCK_DELAY: "0.1"            # stands in for model/tool latency; see tests/load/plan.js
      RATE_LIMIT_ENABLED: "false"  # measuring capacity, not limits (tested elsewhere)
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          docker compose up -d --build postgres redis migrate orchestrator api
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null && break; sleep 3; done
          curl -sf http://127.0.0.1:8000/api/v1/health
      - name: Load test (k6)
        run: |
          chmod 777 tests/load
          set -o pipefail
          docker run --rm --network host -v "$PWD/tests/load:/scripts" grafana/k6:2.3.0 run /scripts/plan.js | tee k6.txt
          { echo "## Load test (mock mode, MOCK_DELAY=$MOCK_DELAY)"; echo '```'; tail -12 k6.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Failure injection and backup/restore drill
        env:
          MOCK_DELAY: "0.6"  # slow enough to kill the orchestrator mid-plan
        run: |
          set -o pipefail
          docker compose up -d orchestrator
          python3 infra/resilience/drill.py | tee drill.txt
          { echo "## Resilience drill"; echo '```'; cat drill.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-summary
          path: tests/load/summary.json
          retention-days: 30
      - name: Stack logs
        if: failure()
        run: docker compose logs --tail 80 api orchestrator postgres

  # Agents as separate services: real ElasticMQ (SQS API) + Redis for the transport tests, then
  # the compose stack with one container per agent (scale-out and queue durability checks).
  agents:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      MOCK_DELAY: "0.2"
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - name: Start SQS (ElasticMQ) and Redis
        run: docker compose -f docker-compose.yml -f docker-compose.agents.yml up -d sqs redis
      - name: Transport tests against real SQS API + Redis
        working-directory: services/api
        env:
          SQS_TEST_ENDPOINT: http://127.0.0.1:9324
          REDIS_TEST_URL: redis://127.0.0.1:6379/0
        run: |
          uv sync --frozen
          uv run pytest -q -rs tests/test_agent_bus.py
      - name: Start stack with agent services
        run: |
          set -euo pipefail
          compose="docker compose -f docker-compose.yml -f docker-compose.agents.yml"
          agents=$($compose config --services | grep '^agent-' || true)
          echo "agent services: ${agents:-none}"
          # shellcheck disable=SC2086
          $compose up -d --build postgres redis sqs migrate orchestrator api $agents
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null && break; sleep 3; done
          curl -sf http://127.0.0.1:8000/api/v1/health
      - name: Plan, scale-out and queue durability checks
        run: |
          set -o pipefail
          python3 infra/resilience/agents_check.py | tee agents.txt
          { echo "## Agents as services"; echo '```'; cat agents.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.agents.yml logs --tail 60

  # Content safety with the real services: the injection classifier image (model pinned and
  # checksummed at build) and ClamAV detecting the EICAR test file.
  safety:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.guard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build guard image (model download cached between runs)
        uses: docker/build-push-action@v6
        with:
          context: services/guard
          load: true
          push: false
          tags: voyagent-guard:ci
          cache-from: type=gha,scope=guard
          cache-to: type=gha,mode=max,scope=guard
      - name: Start guard and ClamAV
        run: |
          docker run -d --name guard -p 8002:8002 -e GUARD_TOKEN=ci-guard-token-0123456789 voyagent-guard:ci
          docker run -d --name clamav -p 3310:3310 clamav/clamav:1.5.4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: |
            services/api/uv.lock
            services/guard/uv.lock
      - name: Guard service tests (incl. real-model quality gate)
        working-directory: services/guard
        run: |
          set -o pipefail
          uv sync --frozen
          docker cp guard:/models/prompt-injection ./model
          GUARD_MODEL_DIR=$PWD/model uv run pytest -q -rs | tee guard.txt
          ! grep -q SKIPPED guard.txt
      - name: Wait for services (ClamAV loads signatures first)
        run: |
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8002/health > /dev/null && break; sleep 5; done
          for _ in $(seq 1 90); do docker exec clamav clamdcheck.sh > /dev/null 2>&1 && break; sleep 5; done
          docker exec clamav clamdcheck.sh
      - name: API integration with the real guard and ClamAV
        working-directory: services/api
        env:
          GUARD_TEST_URL: http://127.0.0.1:8002
          GUARD_TEST_TOKEN: ci-guard-token-0123456789
          CLAMD_TEST_URL: clamd://127.0.0.1:3310
        run: |
          set -o pipefail
          uv sync --frozen
          uv run pytest -q -rs tests/test_guard_and_scanner.py | tee safety.txt
          ! grep -q SKIPPED safety.txt
      - name: Scan guard image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pinned by SHA)
        with:
          image-ref: voyagent-guard:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Service logs
        if: failure()
        run: docker logs guard 2>&1 | tail -40; docker logs clamav 2>&1 | tail -40

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    needs: [web, api]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # report every image's scan
      matrix:
        service: [{ name: api, context: services/api }, { name: web, context: apps/web }]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          load: true
          push: false
          tags: voyagent-${{ matrix.service.name }}:ci
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
      - name: Smoke test (start the container, hit its health endpoint)
        run: |
          set -e
          if [ "${{ matrix.service.name }}" = "api" ]; then
            # public api (in-process orchestrator) and the internal orchestrator command
            docker run -d --name svc -p 8000:8000 -e MOCK_MODE=true voyagent-api:ci
            docker run -d --name orch -p 8001:8001 -e MOCK_MODE=true voyagent-api:ci               sh -c "exec uvicorn orchestrator_app:app --host 0.0.0.0 --port 8001"
            for _ in $(seq 1 30); do
              curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null && curl -sf http://127.0.0.1:8001/internal/v1/health > /dev/null && break
              sleep 2
            done
            curl -sf http://127.0.0.1:8000/api/v1/health
            curl -sf http://127.0.0.1:8001/internal/v1/health
            # a real plan through the container (mock mode)
            curl -sf -X POST http://127.0.0.1:8000/api/v1/plan -H 'content-type: application/json'               -d '{"query":"3 days in Rome"}' | grep -q awaiting_approval
            docker run --rm voyagent-api:ci python -c "import agent_config, rag.retrieval, migrate, maintenance, ingest_worker; print('imports ok')"
          else
            docker run -d --name svc -p 3000:3000 voyagent-web:ci
            for _ in $(seq 1 30); do curl -sf http://127.0.0.1:3000/ > /dev/null && break; sleep 2; done
            curl -sf http://127.0.0.1:3000/ | grep -q Voyagent
          fi
      - name: Container logs
        if: failure()
        run: docker logs svc 2>&1 | tail -80; docker logs orch 2>&1 | tail -40 || true
      - name: Scan image (Trivy, fail on HIGH/CRITICAL with fixes)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pinned by SHA)
        with:
          image-ref: voyagent-${{ matrix.service.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
