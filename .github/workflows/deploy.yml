# Manual deploys only. Each GitHub environment (staging, production) must be configured with
# required reviewers and these variables (no secrets: AWS access is via OIDC):
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECS_CLUSTER, ECS_SUBNETS, ECS_SECURITY_GROUP,
#   ECR_API, ECR_WEB, ECR_GATEWAY, ECR_GUARD, PUBLIC_URL, COGNITO_ISSUER, COGNITO_CLIENT_ID, COGNITO_DOMAIN
# Not yet run: no AWS account is connected.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read
  id-token: write   # OIDC token for the AWS deploy role

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ECR login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images (immutable tag = commit SHA)
        run: |
          set -euo pipefail
          docker build -t "${{ vars.ECR_API }}:$IMAGE_TAG" services/api
          docker build -t "${{ vars.ECR_GATEWAY }}:$IMAGE_TAG" services/model-gateway
          docker build -t "${{ vars.ECR_GUARD }}:$IMAGE_TAG" services/guard
          docker build -t "${{ vars.ECR_WEB }}:$IMAGE_TAG" \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.PUBLIC_URL }}" \
            --build-arg NEXT_PUBLIC_AUTH_MODE=cognito \
            --build-arg NEXT_PUBLIC_COGNITO_ISSUER="${{ vars.COGNITO_ISSUER }}" \
            --build-arg NEXT_PUBLIC_COGNITO_CLIENT_ID="${{ vars.COGNITO_CLIENT_ID }}" \
            --build-arg NEXT_PUBLIC_COGNITO_DOMAIN="${{ vars.COGNITO_DOMAIN }}" \
            apps/web

      - name: Scan images (block HIGH/CRITICAL with fixes)
        run: |
          set -euo pipefail
          for img in "${{ vars.ECR_API }}" "${{ vars.ECR_WEB }}" "${{ vars.ECR_GUARD }}"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$img:$IMAGE_TAG"
          done

      - name: Push
        run: |
          docker push "${{ vars.ECR_API }}:$IMAGE_TAG"
          docker push "${{ vars.ECR_GATEWAY }}:$IMAGE_TAG"
          docker push "${{ vars.ECR_GUARD }}:$IMAGE_TAG"
          docker push "${{ vars.ECR_WEB }}:$IMAGE_TAG"

      - name: Migrate, roll out, smoke test (auto-rollback on failure)
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SUBNETS: ${{ vars.ECS_SUBNETS }}
          SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
          ECR_API: ${{ vars.ECR_API }}
          ECR_WEB: ${{ vars.ECR_WEB }}
          ECR_GATEWAY: ${{ vars.ECR_GATEWAY }}
          ECR_GUARD: ${{ vars.ECR_GUARD }}
          HEALTH_URL: ${{ vars.PUBLIC_URL }}/api/v1/health
        run: bash infra/deploy/deploy.sh
