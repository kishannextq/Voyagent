# Agents as separate services: one worker container per agent, tasks over SQS (ElasticMQ
# locally), results over Redis. See services/api/agent_bus.py.
#
#   docker compose -f docker-compose.yml -f docker-compose.agents.yml up --build
#   docker compose -f docker-compose.yml -f docker-compose.agents.yml up --scale agent-weather=3
#
# Agents not listed in REMOTE_AGENTS run inside the orchestrator as before.

x-sqs-env: &sqs-env
  REDIS_URL: redis://redis:6379/0
  AWS_ENDPOINT_URL_SQS: http://sqs:9324
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: local-only          # ElasticMQ ignores credentials
  AWS_SECRET_ACCESS_KEY: local-only
  AGENT_QUEUE_PREFIX: voyagent-local-
  APP_ENV: ${APP_ENV:-local}
  MOCK_MODE: ${MOCK_MODE:-true}
  MOCK_DELAY: ${MOCK_DELAY:-0.4}
  METRICS_PORT: "9464"
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-agent: &agent
  build: ./services/api
  restart: unless-stopped
  stop_grace_period: 110s                 # AGENT_DRAIN_SECONDS + margin
  healthcheck:
    test: ["CMD", "python", "agent_worker.py", "--health"]
    interval: 15s
    timeout: 3s
    retries: 3
  depends_on:
    redis: { condition: service_healthy }
    sqs: { condition: service_started }

services:
  sqs:
    image: softwaremill/elasticmq-native:1.7.1@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c
    volumes:
      - ./infra/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    ports: ["127.0.0.1:9324:9324", "127.0.0.1:9325:9325"]   # SQS API, stats UI

  orchestrator:
    environment:
      <<: *sqs-env
      REMOTE_AGENTS: "supervisor,flight_agent,hotel_agent,weather_agent,budget_agent,itinerary_agent"
    depends_on:
      sqs: { condition: service_started }

  agent-supervisor:   # supervisor: validates the request and picks the agents
    <<: *agent
    command: ["python", "agent_worker.py", "supervisor"]
    environment:
      <<: *sqs-env
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-}
      LLM_GATEWAY_KEY: ${LLM_GATEWAY_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}

  agent-flight:   # flight_agent: airports, airlines, flight guidance
    <<: *agent
    command: ["python", "agent_worker.py", "flight_agent"]
    environment:
      <<: *sqs-env
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-}
      LLM_GATEWAY_KEY: ${LLM_GATEWAY_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AVIATION_STACK_API_KEY: ${AVIATION_STACK_API_KEY:-}
      GUARD_URL: ${GUARD_URL:-}
      GUARD_TOKEN: ${GUARD_TOKEN:-local-only-guard-token}

  agent-hotel:   # hotel_agent: where to stay (web search)
    <<: *agent
    command: ["python", "agent_worker.py", "hotel_agent"]
    environment:
      <<: *sqs-env
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GUARD_URL: ${GUARD_URL:-}
      GUARD_TOKEN: ${GUARD_TOKEN:-local-only-guard-token}

  agent-weather:   # weather_agent: current weather and forecast
    <<: *agent
    command: ["python", "agent_worker.py", "weather_agent"]
    environment:
      <<: *sqs-env
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      GUARD_URL: ${GUARD_URL:-}
      GUARD_TOKEN: ${GUARD_TOKEN:-local-only-guard-token}

  agent-budget:   # budget_agent: budget feasibility (+ organisation travel policy)
    <<: *agent
    command: ["python", "agent_worker.py", "budget_agent"]
    environment:
      <<: *sqs-env
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-}
      LLM_GATEWAY_KEY: ${LLM_GATEWAY_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-voyagent}:${POSTGRES_PASSWORD:-voyagent_local_only}@postgres:5432/${POSTGRES_DB:-voyagent}
      RAG_EMBEDDER: ${RAG_EMBEDDER:-hash}
    depends_on:
      redis: { condition: service_healthy }
      sqs: { condition: service_started }
      migrate: { condition: service_completed_successfully }

  agent-itinerary:   # itinerary_agent: the day-by-day draft for review (+ organisation guides)
    <<: *agent
    command: ["python", "agent_worker.py", "itinerary_agent"]
    environment:
      <<: *sqs-env
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-}
      LLM_GATEWAY_KEY: ${LLM_GATEWAY_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-voyagent}:${POSTGRES_PASSWORD:-voyagent_local_only}@postgres:5432/${POSTGRES_DB:-voyagent}
      RAG_EMBEDDER: ${RAG_EMBEDDER:-hash}
    depends_on:
      redis: { condition: service_healthy }
      sqs: { condition: service_started }
      migrate: { condition: service_completed_successfully }
