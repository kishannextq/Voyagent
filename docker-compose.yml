# Local development stack. Usage:
#   cp .env.example .env
#   docker compose up --build            # web :3000, api :8000, postgres :5432, redis :6379
#   docker compose --profile tools up    # + pgAdmin :5050
# Postgres uses the pgvector image so the RAG phase needs no image change.

name: voyagent

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voyagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voyagent_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-voyagent}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: app schema (Alembic) + checkpointer tables, like the pre-deploy task in AWS.
  migrate:
    build: ./services/api
    command: ["python", "migrate.py"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-voyagent}:${POSTGRES_PASSWORD:-voyagent_local_only}@postgres:5432/${POSTGRES_DB:-voyagent}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Model gateway (LiteLLM). Opt in: docker compose --profile gateway up, then set
  # LLM_GATEWAY_URL=http://gateway:4000 and LLM_GATEWAY_KEY (from services/model-gateway/bootstrap.py).
  gateway:
    profiles: ["gateway"]
    build: ./services/model-gateway
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-only-change-me}
      LITELLM_DATABASE_URL: postgresql://${POSTGRES_USER:-voyagent}:${POSTGRES_PASSWORD:-voyagent_local_only}@postgres:5432/litellm
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Internal: runs plans (graph, tools, provider keys, checkpoints, memory). Not published.
  orchestrator:
    build: ./services/api
    command: ["sh", "-c", "exec uvicorn orchestrator_app:app --host 0.0.0.0 --port 8001"]
    env_file:
      - path: .env   # provider keys live only here, never in the public api
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-voyagent}:${POSTGRES_PASSWORD:-voyagent_local_only}@postgres:5432/${POSTGRES_DB:-voyagent}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-local}
      MOCK_MODE: ${MOCK_MODE:-true}
      CHECKPOINTER_SETUP: "false"  # done by the migrate service
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN:-local-only-orchestrator-token}
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-}
      METRICS_PORT: "9464"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RAG_EMBEDDER: ${RAG_EMBEDDER:-hash}
      LLM_GATEWAY_KEY: ${LLM_GATEWAY_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/internal/v1/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Processes uploaded documents (extract, chunk, embed) from the Redis queue.
  ingest-worker:
    build: ./services/api
    command: ["python", "ingest_worker.py"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-voyagent}:${POSTGRES_PASSWORD:-voyagent_local_only}@postgres:5432/${POSTGRES_DB:-voyagent}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-local}
      RAG_EMBEDDER: ${RAG_EMBEDDER:-hash}
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-}
      LLM_GATEWAY_KEY: ${LLM_GATEWAY_KEY:-}
      METRICS_PORT: "9464"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Public API: auth, limits, ownership; relays runs to the orchestrator. No provider keys.
  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-voyagent}:${POSTGRES_PASSWORD:-voyagent_local_only}@postgres:5432/${POSTGRES_DB:-voyagent}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-local}
      MOCK_MODE: ${MOCK_MODE:-true}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
      AUTH_MODE: ${AUTH_MODE:-disabled}
      COGNITO_REGION: ${COGNITO_REGION:-}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_IDS: ${COGNITO_CLIENT_IDS:-}
      ORCHESTRATOR_URL: http://orchestrator:8001
      METRICS_PORT: "9464"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RAG_EMBEDDER: ${RAG_EMBEDDER:-hash}
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN:-local-only-orchestrator-token}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      orchestrator: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }

  pgadmin:
    image: dpage/pgadmin4:8
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-local_only}
    ports: ["127.0.0.1:5050:80"]
    depends_on: [postgres]

  # ---- Observability (docker compose --profile observability up; set
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 for the app services) ----
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    user: "0"  # reads Docker's container log files (local/CI only)
    volumes:
      - ./infra/observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports: ["127.0.0.1:4318:4318"]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.16.0
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/config.yaml"]
    user: "0"  # writes to the local volume (local/CI only)
    volumes:
      - ./infra/observability/loki/config.yaml:/etc/loki/config.yaml:ro
    ports: ["127.0.0.1:3100:3100"]

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo/config.yaml"]
    user: "0"  # writes to the local volume (local/CI only)
    volumes:
      - ./infra/observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
    ports: ["127.0.0.1:3200:3200"]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local_only}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus, loki, tempo]

volumes:
  pgdata:
