# Local SQS (ElasticMQ) for agents running as separate services (docker-compose.agents.yml).
# One queue per agent plus a dead-letter queue, mirroring infra/terraform/modules/services (agents).
# Visibility timeout > the agent's timeout_seconds + AGENT_QUEUE_WAIT_SECONDS.
include classpath("application.conf")

queues {
  voyagent-local-supervisor {
    defaultVisibilityTimeout = 90 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "voyagent-local-supervisor-dlq"
      maxReceiveCount = 3
    }
  }
  voyagent-local-supervisor-dlq {}
  voyagent-local-flight-agent {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "voyagent-local-flight-agent-dlq"
      maxReceiveCount = 3
    }
  }
  voyagent-local-flight-agent-dlq {}
  voyagent-local-hotel-agent {
    defaultVisibilityTimeout = 105 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "voyagent-local-hotel-agent-dlq"
      maxReceiveCount = 3
    }
  }
  voyagent-local-hotel-agent-dlq {}
  voyagent-local-weather-agent {
    defaultVisibilityTimeout = 105 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "voyagent-local-weather-agent-dlq"
      maxReceiveCount = 3
    }
  }
  voyagent-local-weather-agent-dlq {}
  voyagent-local-budget-agent {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "voyagent-local-budget-agent-dlq"
      maxReceiveCount = 3
    }
  }
  voyagent-local-budget-agent-dlq {}
  voyagent-local-itinerary-agent {
    defaultVisibilityTimeout = 150 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "voyagent-local-itinerary-agent-dlq"
      maxReceiveCount = 3
    }
  }
  voyagent-local-itinerary-agent-dlq {}
}
