# OpenTelemetry Collector: traces from the services -> Tempo; container logs -> Loki.
# Metrics are scraped by Prometheus directly from each service's METRICS_PORT.
receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
      grpc: { endpoint: 0.0.0.0:4317 }
  # JSON log lines from Docker's json-file driver (Linux hosts and CI; Docker Desktop keeps these
  # inside its VM, so local log shipping needs a Linux host or WSL with this path mounted).
  filelog:
    include: [/var/lib/docker/containers/*/*-json.log]
    start_at: beginning
    operators:
      - type: json_parser          # docker wrapper {"log": "...", "stream": "...", "time": "..."}
      - type: move
        from: attributes.log
        to: body
      - type: json_parser          # our JSON log line (non-JSON lines are dropped below)
        parse_from: body
        on_error: send_quiet
      - type: move
        from: attributes.service
        to: resource["service.name"]
        on_error: send_quiet

processors:
  memory_limiter: { check_interval: 1s, limit_mib: 400, spike_limit_mib: 100 }
  batch: { timeout: 2s }
  # Only keep logs from Voyagent services (lines that carried our "service" field).
  filter/voyagent_logs:
    error_mode: ignore
    logs:
      log_record:
        - 'resource.attributes["service.name"] == nil'

exporters:
  otlphttp/tempo: { endpoint: "http://tempo:4318", tls: { insecure: true } }
  otlphttp/loki: { endpoint: "http://loki:3100/otlp", tls: { insecure: true } }

extensions:
  health_check: { endpoint: "0.0.0.0:13133" }

service:
  extensions: [health_check]
  pipelines:
    traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/tempo] }
    logs: { receivers: [filelog, otlp], processors: [memory_limiter, filter/voyagent_logs, batch], exporters: [otlphttp/loki] }
