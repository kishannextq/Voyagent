groups:
  - name: voyagent
    rules:
      - alert: VoyagentTargetDown
        expr: up{job="voyagent"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.component }} is not being scraped" }

      - alert: VoyagentHighErrorRate
        expr: |
          sum(rate(voyagent_http_requests_total{service="api",status=~"5.."}[5m]))
            / clamp_min(sum(rate(voyagent_http_requests_total{service="api"}[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "API 5xx ratio above 5% for 5 minutes" }

      - alert: VoyagentPlanFailures
        expr: |
          sum(rate(voyagent_runs_total{outcome=~"error|timeout"}[15m]))
            / clamp_min(sum(rate(voyagent_runs_total[15m])), 1e-9) > 0.10
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "More than 10% of plan runs fail or time out" }

      - alert: VoyagentSlowPlans
        expr: histogram_quantile(0.95, sum by (le) (rate(voyagent_run_duration_seconds_bucket{kind="start"}[15m]))) > 120
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "p95 planning run slower than 120s" }

      - alert: VoyagentModelFallbacks
        expr: sum(rate(voyagent_llm_calls_total{mode="fallback"}[15m])) > 0.05
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Live model calls are failing over to demo data" }

      - alert: VoyagentCapacity
        expr: sum(increase(voyagent_busy_rejections_total[10m])) > 0
        labels: { severity: warning }
        annotations: { summary: "Orchestrator at MAX_CONCURRENT_RUNS: users get 503s; scale out" }

      - alert: VoyagentSystemPromptLeak
        expr: sum(increase(voyagent_guardrail_events_total{stage="output_withheld"}[10m])) > 0
        labels: { severity: critical }
        annotations: { summary: "A model output contained the system-prompt canary (withheld): investigate prompt injection" }

      - alert: VoyagentInjectionSpike
        expr: sum(increase(voyagent_guardrail_events_total{stage="input_blocked"}[10m])) > 50
        labels: { severity: warning }
        annotations: { summary: "Unusual number of blocked prompt-injection attempts" }

      - alert: VoyagentIngestFailures
        expr: sum(increase(voyagent_rag_ingest_total{status="failed"}[30m])) > 5
        labels: { severity: warning }
        annotations: { summary: "Document ingestion failures" }
