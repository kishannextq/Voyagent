global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: voyagent
    static_configs:
      - targets: ["api:9464"]
        labels: { component: api }
      - targets: ["orchestrator:9464"]
        labels: { component: orchestrator }
      - targets: ["ingest-worker:9464"]
        labels: { component: ingest-worker }
