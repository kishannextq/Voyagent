# Application schema migrations. Run: uv run python migrate.py (uses DATABASE_URL).
[alembic]
script_location = migrations
version_locations = migrations/versions
# The URL comes from DATABASE_URL in migrations/env.py; never put credentials here.

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
