[project]
name = "voyagent-api"
version = "0.2.0"
description = "Voyagent API: FastAPI + LangGraph multi-agent travel planner"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]==0.47.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "langchain-core==1.7.7",
    "langchain-groq==1.1.2",
    "langchain-mcp-adapters==0.2.2",
    "langgraph==1.2.4",
    "langgraph-checkpoint-postgres==3.1.0",
    "psycopg[binary,pool]==3.3.4",
    "mcp==1.30.0",
    # Security floor (CVE-2026-104873); transitive via langgraph
    "langgraph-sdk>=0.4.4",
    "aviationstack-mcp>=1.8.1",
    "redis==6.4.0",
    "pyjwt[crypto]==2.15.1",
    "alembic==1.20.1",
    "sqlalchemy==2.1.8",
    "langchain-openai==1.7.4",
    "pyyaml==6.0.3",
    "python-multipart==0.0.33",
    "pypdf==7.0.1",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-httpx==0.66b2",
    "prometheus-client==0.26.0",
    "boto3==1.44.0",  # SQS transport for remote agents (agent_bus.py)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx==0.28.1",
    "ruff>=0.8",
    "fakeredis>=2.31",
]
rag-local = [
    "fastembed==0.9.1",
]

[tool.uv]
# Supply-chain cooldown: resolve only releases published before this date (bump deliberately).
exclude-newer = "2026-11-11T00:00:00Z"
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
