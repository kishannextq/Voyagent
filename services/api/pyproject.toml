[project]
name = "voyagent-api"
version = "0.2.0"
description = "Voyagent API: FastAPI + LangGraph multi-agent travel planner"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]==0.47.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "langchain-core==1.4.0",
    "langchain-groq==1.1.2",
    "langchain-mcp-adapters==0.2.2",
    "langgraph==1.2.0",
    "langgraph-checkpoint-postgres==3.1.0",
    "psycopg[binary,pool]==3.3.4",
    "mcp==1.27.2",
    "aviationstack-mcp>=1.8.1",
    "redis==6.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx==0.28.1",
    "ruff>=0.8",
    "fakeredis>=2.31",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
